<!doctype html>
<html lang="es-PA" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <!-- Escudo del colegio: .ico para pestañas, PNG para Android/Chrome -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/icon-192.png"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />

        <title>Colegio Bilingüe La Colmena — Aguadulce, Coclé</title>
        <meta
            name="description"
            content="Colegio bilingüe en Aguadulce, Coclé. Pre-escolar, primaria, pre-media y bachiller en ciencias. Pre-matrícula en línea y portal para acudientes."
        />
        <meta name="author" content="Colegio Bilingüe La Colmena" />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://lacolmena.edu.pa/" />

        <!-- Open Graph / redes sociales: las lee el crawler sin ejecutar JS,
         por eso viven aquí además del componente <Seo />. -->
        <meta property="og:site_name" content="Colegio Bilingüe La Colmena" />
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="es_PA" />
        <meta
            property="og:title"
            content="Colegio Bilingüe La Colmena — Aguadulce, Coclé"
        />
        <meta
            property="og:description"
            content="Veinte años formando estudiantes con valores, criterio y dominio del inglés."
        />
        <meta property="og:url" content="https://lacolmena.edu.pa/" />
        <!-- Imagen cuadrada y URL absoluta: WhatsApp la muestra como
         miniatura del escudo junto al texto (como youtube.com). -->
        <meta
            property="og:image"
            content="https://lacolmena.edu.pa/og-image.jpg"
        />
        <meta
            property="og:image:secure_url"
            content="https://lacolmena.edu.pa/og-image.jpg"
        />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="600" />
        <meta property="og:image:height" content="600" />
        <meta
            property="og:image:alt"
            content="Escudo del Colegio Bilingüe La Colmena"
        />
        <meta name="twitter:card" content="summary" />

        <meta name="theme-color" content="#2E3A33" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="La Colmena" />
        <!-- Con fondo crema: iOS rellena de negro lo transparente -->
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    </head>
    <body>
        <div id="root"></div>
        <!-- Netlify Forms lee el HTML al desplegar, sin ejecutar JavaScript:
         este formulario oculto le declara los campos de la pre-matrícula,
         que React envía por fetch (src/views/landing/PreMatricula.jsx). -->
        <form
            name="pre-matricula"
            data-netlify="true"
            netlify-honeypot="bot-field"
            hidden
        >
            <input name="bot-field" />
            <input name="estudiante_nombre" />
            <input name="estudiante_apellido" />
            <input name="estudiante_nacimiento" type="date" />
            <input name="grado" />
            <input name="colegio_procedencia" />
            <input name="acudiente_nombre" />
            <input name="acudiente_apellido" />
            <input name="correo" type="email" />
            <input name="telefono" />
            <input name="fuente" />
            <textarea name="comentarios"></textarea>
            <input name="consentimiento" />
            <input name="aviso_version" />
            <input name="idioma" />
        </form>
        <noscript>
            <h1>Colegio Bilingüe La Colmena</h1>
            <p>
                Colegio bilingüe en Aguadulce, provincia de Coclé, Panamá.
                Pre-escolar, primaria, pre-media y bachiller en ciencias.
            </p>
            <p>
                Para ver el sitio necesitas activar JavaScript. También puedes
                escribirnos a esclacolmena@gmail.com o llamar al 988-8181.
            </p>
        </noscript>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
